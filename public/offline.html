<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nincs kapcsolat — Anime Graph</title>
<!--
  Onallo, kulso fuggoseg nelkuli oldal: offline pont a halozat hianyzik, tehat
  sem webfont, sem CSS-fajl nem tolthet be. A szinek a globals.css tokenjeivel
  egyeznek (--bg, --text-1, --text-2, --surface-2-*).
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background: #09090b;
    color: #fafafa;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 26rem;
    text-align: center;
    padding: 2rem 1.5rem;
    border-radius: 1.25rem;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  svg { display: block; margin: 0 auto 1.25rem; opacity: 0.55; }
  h1 { margin: 0 0 0.5rem; font-size: 1.125rem; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0; font-size: 0.875rem; line-height: 1.6; color: #a1a1aa; }
  button {
    margin-top: 1.5rem;
    width: 100%;
    padding: 0.75rem 1.25rem;
    font: inherit;
    font-size: 0.875rem;
    color: #fafafa;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 0.75rem;
    cursor: pointer;
  }
  button:hover { background: rgba(255, 255, 255, 0.12); }
  button:focus-visible { outline: 2px solid #fafafa; outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="6.5" r="3"></circle>
      <circle cx="5.5" cy="17.5" r="2.5"></circle>
      <circle cx="18.5" cy="17.5" r="2.5"></circle>
      <path d="M10 9 7 15M14 9l3 6M8 17.5h8"></path>
    </svg>
    <h1>Nincs internetkapcsolat</h1>
    <p>Az Anime Graph nem éri el a szervert. Ellenőrizd a kapcsolatot, aztán próbáld újra.</p>
    <button type="button" onclick="location.reload()">Újra</button>
  </main>
</body>
</html>
