name: catalog-full-sync
on:
  workflow_dispatch:
    inputs:
      media_type:
        description: Teljesen szinkronizálandó katalógus
        required: true
        type: choice
        options:
          - ANIME
          - MANGA

permissions:
  contents: read

concurrency:
  group: catalog-maintenance
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node scripts/sync-catalog.mjs --type="${{ inputs.media_type }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: node scripts/recompute-scores.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
