name: offline-db-sync
on:
  schedule:
    - cron: '17 4 * * 1'   # hétfő 04:17 UTC, hetente
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: catalog-maintenance
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: import offline-db (bulk katalógus-seed, no rate-limit)
        run: node scripts/import-offline-db.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: backfill missing descriptions (AniList)
        run: node scripts/backfill-descriptions.mjs --only-missing
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: sync AniList recommendations cache
        run: node scripts/sync-title-recs.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: recompute community scores
        run: node scripts/recompute-scores.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
